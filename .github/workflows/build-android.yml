name: Build REC Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rec-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build native Android app
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signing and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RECRemote-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RECRemote-Android-APK
          path: dist/RECRemote-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Android download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v1.0.0-build.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/RECRemote-Android.apk --clobber
          else
            gh release create "$tag" dist/RECRemote-Android.apk --target "$GITHUB_SHA" --title 'REC Remote for Android — Development APK' --notes-file android/RELEASE_NOTES.md
          fi
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RECRemote-Android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
