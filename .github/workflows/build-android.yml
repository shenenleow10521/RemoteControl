name: Build REC Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rec-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keep the Pad development signing identity for updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rec-remote-pad-debug-signing-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build native Android app
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify every control fits on a small landscape screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 800x360
            adb shell wm density 160
            gradle --project-dir android --no-daemon :app:connectedDebugAndroidTest
            mkdir -p dist
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.shenen.rec.pad.debug/com.shenen.rec.remote.MainActivity
            adb shell screencap -p /sdcard/layout-800x360.png
            adb pull /sdcard/layout-800x360.png dist/layout-800x360.png
      - name: Verify APK signing and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RECRemote-Pad-v1.0.10.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RECRemote-Android-APK
          path: dist/RECRemote-Pad-v1.0.10.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Android download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v1.0.10-build.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/RECRemote-Pad-v1.0.10.apk --clobber
          else
            gh release create "$tag" dist/RECRemote-Pad-v1.0.10.apk --target "$GITHUB_SHA" --title 'REC Remote for Android — Development APK' --notes-file android/RELEASE_NOTES.md
          fi
      - name: Save verified layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RECRemote-Pad-layout
          path: dist/layout-800x360.png
          if-no-files-found: ignore
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RECRemote-Android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
